name: ACRIS court order leads

on:
  schedule:
    - cron: "15 16 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull (ACRIS caps the search at 31)"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: acris-leads
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: Diagnose ACRIS reachability
        run: |
          echo "runner ip: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          curl -s -o /tmp/form.html -w "status=%{http_code} bytes=%{size_download} time=%{time_total}\n" \
            -A "Mozilla/5.0" -c /tmp/jar \
            "https://a836-acris.nyc.gov/DS/DocumentSearch/DocumentType" || echo "curl exit code $?"
          echo "--- token found: $(grep -c '__RequestVerificationToken' /tmp/form.html || true) ---"
          echo "--- first 400 chars ---"
          head -c 400 /tmp/form.html; echo

      - name: Pull the document index from ACRIS
        env:
          DAYS: ${{ github.event.inputs.days || '4' }}
        run: |
          set +e
          python3 scripts/acris_live.py --days "$DAYS" --out /tmp/run
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "::error::ACRIS search failed after retries. Feed not updated."
            exit 1
          fi
          if [ $code -ne 0 ]; then
            echo "Nothing recorded in that window."
            echo "OUTCOME=nothing recorded" >> "$GITHUB_ENV"
          fi

      - name: Read the documents and merge into the feed
        run: |
          if [ ! -f /tmp/run.json ]; then
            echo "No index file; nothing recorded in that window. Stopping cleanly."
            echo "OUTCOME=nothing recorded" >> "$GITHUB_ENV"
            exit 0
          fi
          python3 scripts/ctor_leads.py \
            --json /tmp/run.json \
            --out /tmp/run_leads \
            --feed leads.json
          echo "OUTCOME=documents read" >> "$GITHUB_ENV"

      # Runs every time, including after a failure, so the page always
      # shows when the job last ran. OUTCOME is unset only if neither
      # success path above was reached, which is recorded as failed.
      - name: Write run status
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, datetime
          json.dump({"checked": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                     "outcome": os.environ.get("OUTCOME") or "failed"},
                    open("status.json", "w", encoding="utf-8"), indent=1)
          PY

      - name: Commit the feed and run status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f status.json ] && git add status.json
          [ -f leads.json ] && git add leads.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "leads: $(date -u '+%Y-%m-%d %H:%M UTC') (${OUTCOME:-failed})"
            git pull --rebase --autostash
            git push
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f leads.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("leads.json"))
          print(f"**{d['count']} documents in the feed**\n")
          print(f"- in rem: {d['in_rem']}")
          print(f"- foreclosure and sale: {d['jfs']}")
          print(f"- feed changed: {d['updated']}")
          PY
          fi
          if [ -f status.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("status.json"))
          print(f"- checked: {s['checked']} ({s['outcome']})")
          PY
          fi
